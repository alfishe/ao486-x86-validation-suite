# DOSBox-X configuration for POC-01 Push Mode
# Non-interactive, auto-exit, serial to TCP

[sdl]
autolock=false
waitonerror=false

[dosbox]
machine=svga_s3
memsize=16

[cpu]
core=auto
cputype=486
cycles=max

[serial]
# Serial port 1 -> TCP server on port 5555
# Host connects with: nc localhost 5555
serial1=nullmodem server:127.0.0.1 port:5555 transparent:1

[dos]
# Disable prompts
automount=true

[autoexec]
@echo off
mount c .
c:
push.com
exit
