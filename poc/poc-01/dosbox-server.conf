# DOSBox-X configuration for POC-01 Server Mode
# Interactive serial CLI - DOSBox connects to host listener

[sdl]
autolock=false
waitonerror=false

[dosbox]
machine=svga_s3
memsize=16
quit warning=false
fastbioslogo=true

[cpu]
core=auto
cputype=486
cycles=max

[serial]
# Serial port 1 -> connect to host on port 5555
# Start host listener FIRST: nc -l 5555 or ./client.py
serial1=nullmodem server:127.0.0.1 port:5555 transparent:1

[dos]
automount=true

[autoexec]
@echo off
mount c .
c:
server.com
exit
